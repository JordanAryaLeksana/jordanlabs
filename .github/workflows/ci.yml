name: CI

on:
  push: 
    branches:
     - master
  
  pull_request:
   branches:
     - master

jobs:
  validate:
    name: Validate JordanLabs

    runs-on: ubuntu-latest

    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: action/setup-node@v7
        with: 
          node-version-file: .nvmrc
          cache: npm
      - name: install dependencies
        run: npm ci 

      - name: Typescript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint 

      - name: Build Docker Image
        run: docker build -t jordanlabs:ci 
