name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jordanaryaleksana/jordanlabs

jobs:
  validate:
    name: Validate JordanLabs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint


  image:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - validate

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    needs:
      - image

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" \
            > ~/.ssh/jordanlabs_deploy

          chmod 600 ~/.ssh/jordanlabs_deploy

          ssh-keyscan \
            -H "${{ secrets.VPS_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Deploy JordanLabs
        run: |
          ssh \
            -i ~/.ssh/jordanlabs_deploy \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            '
              set -e

              cd /opt/jordanlabs

              docker compose pull app

              docker compose up -d app

              docker image prune -f
            '

      - name: Production health check
        run: |
          sleep 10

          curl \
            --fail \
            --silent \
            --show-error \
            https://jordanlabs.my.id > /dev/null

          echo "JordanLabs production is healthy."